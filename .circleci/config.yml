---
version: 2.1
jobs:
  build:
    parameters:
      gemfile:
        description: "Gemfile to run"
        default: "Gemfile"
        type: "string"
      ruby:
        description: "Ruby version"
        default: "3.3.11"
        type: "string"
    docker:
      - image: cimg/ruby:<< parameters.ruby >>
        environment:
          RAILS_ENV: test
      - image: postgres:15.2
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: Valkyrie_gem_test
          POSTGRES_HOST_AUTH_METHOD: trust
      - image: samvera/fcrepo4:4.7.5
        environment:
          CATALINA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xms512m -Xmx1024m -XX:NewSize=256m -XX:MaxNewSize=256m -XX:PermSize=256m -XX:MaxPermSize=256m -XX:+DisableExplicitGC"
          JAVA_OPTIONS: "-Djetty.http.port=8988"
      - image: fcrepo/fcrepo:6.5.1-RC3-tomcat9
        environment:
          CATALINA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xms512m -Xmx1024m -XX:NewSize=256m -XX:MaxNewSize=256m -XX:PermSize=256m -XX:MaxPermSize=256m -XX:+DisableExplicitGC -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true"
          JAVA_OPTS: "-Djetty.http.port=8978 -Dfcrepo.dynamic.jms.port=61619 -Dfcrepo.dynamic.stomp.port=61615 -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true"
      - image: fcrepo/fcrepo:7-tomcat10
        environment:
          CATALINA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xms512m -Xmx1024m -XX:NewSize=256m -XX:MaxNewSize=256m -XX:+DisableExplicitGC -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true"
          JAVA_OPTS: "-Djetty.http.port=8968 -Dfcrepo.dynamic.jms.port=61620 -Dfcrepo.dynamic.stomp.port=61616 -Dorg.apache.tomcat.util.buf.UDecoder.ALLOW_ENCODED_SLASH=true"
      - image: solr:9.9.0
        command: bin/solr -cloud -noprompt -f -p 8994
        environment:
          SOLR_MODULES: "analysis-extras,extraction"
    environment:
      BUNDLE_GEMFILE: << parameters.gemfile >>
      POSTGRES_PORT: 5432
      FEDORA_6_PORT: 8080
    resource_class: medium+
    steps:
      - checkout

      - run:
          name: Check for 'master' branch
          command: |
              git fetch --all --quiet --prune --prune-tags
              if [[ -n "$(git branch --all --list master */master)" ]]; then
                  echo "A branch named 'master' was found. Please remove it."
                  echo "$(git branch --all --list master */master)"
              fi
              [[ -z "$(git branch --all --list master */master)" ]]
      - run:
          name: Wait for solr
          command: dockerize -wait tcp://localhost:8994 -timeout 1m
      - run:
          name: Load config into solr
          command: |
            cd solr/config
            zip -1 -r solr_config.zip ./*
            curl -H "Content-type:application/octet-stream" --data-binary @solr_config.zip "http://localhost:8994/solr/admin/configs?action=UPLOAD&name=valkyrie"
            curl -H 'Content-type: application/json' http://localhost:8994/api/collections/ -d '{"name": "valkyrie-core-test", "config": "valkyrie", "numShards": 1}'
      # Install Bundler
      - run: gem install bundler -v '~> 2.0'
      - restore_cache:
         keys:
           - bundle-{{ checksum "<< parameters.gemfile >>" }}-{{ checksum "valkyrie.gemspec" }}-<< parameters.ruby >>-7
      - run: sudo apt update -y && sudo apt-get install -y libpq-dev lsof
      - run:
          name: Set BUNDLE_GEMFILE
          command: |
            export BUNDLE_GEMFILE=~/project/<< parameters.gemfile >>
      - run: bundle config set path 'vendor/bundle'
      - run: bundle install
      - save_cache:
          key: bundle-{{ checksum "<< parameters.gemfile >>" }}-{{ checksum "valkyrie.gemspec" }}-<< parameters.ruby >>-7
          paths:
            - "vendor/bundle"
            - "gemfiles/vendor/bundle"
      - run:
          name: Run Rubocop
          command: bundle exec rake rubocop
      - run:
          name: Set up database
          command: bundle exec rake db:migrate
      - run:
          name: Run Specs
          command: bundle exec rspec spec
      - store_artifacts:
          path: coverage
          destination: coverage
workflows:
  version: 2
  build:
    jobs:
      - build:
          gemfile: "gemfiles/activerecord_7_2.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails7-2"
      - build:
          gemfile: "gemfiles/activerecord_8_0.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails8-0"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails8-1"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 3.4.9
          name: "Ruby3-4_rails8-1"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 4.0.5
          name: "Ruby4-0_rails8-1"

  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          gemfile: "gemfiles/activerecord_7_2.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails7-2"
      - build:
          gemfile: "gemfiles/activerecord_8_0.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails8-0"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 3.3.11
          name: "Ruby3-3_rails8-1"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 3.4.9
          name: "Ruby3-4_rails8-1"
      - build:
          gemfile: "gemfiles/activerecord_8_1.gemfile"
          ruby: 4.0.5
          name: "Ruby4-0_rails8-1"
